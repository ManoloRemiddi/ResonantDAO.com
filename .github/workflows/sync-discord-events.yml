name: Sync Discord events

# Reads upcoming Discord Scheduled Events with a bot token kept in the
# DISCORD_BOT_TOKEN repository secret, sanitizes them to public-facing
# fields, and commits events/discord-events.json. GitHub Pages then
# rebuilds automatically, so the events page always shows the live
# Discord calendar without any credentials reaching the browser.

on:
  schedule:
    # Every 30 minutes. Discord event data changes rarely; this keeps
    # worst-case staleness under an hour including the Pages rebuild.
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/sync-discord-events.py"
      - ".github/workflows/sync-discord-events.yml"

permissions:
  contents: write

concurrency:
  group: sync-discord-events
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Fetch and sanitize the Discord event feed
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
        run: python3 scripts/sync-discord-events.py events/discord-events.json

      - name: Commit the feed when it changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events/discord-events.json
          # stage first, then diff the index: catches a brand-new untracked
          # feed on the very first run, which `git diff` alone would miss
          if git diff --staged --quiet -- events/discord-events.json; then
            echo "Feed unchanged; nothing to push."
          else
            git commit -m "events: refresh Discord event feed"
            git push
            echo "Feed updated and pushed."
          fi
