<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ResonantDAO</title>
    <meta
      name="description"
      content="ResonantDAO is the Community of Communities layer for ResonantOS."
    />
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #0c0f12;
        color: #f4f0e8;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          linear-gradient(135deg, rgba(79, 141, 116, 0.18), transparent 42%),
          linear-gradient(315deg, rgba(174, 111, 78, 0.16), transparent 44%),
          #0c0f12;
      }

      main {
        width: min(760px, calc(100% - 48px));
      }

      p {
        max-width: 680px;
        color: #c9c0b3;
        font-size: clamp(1rem, 2vw, 1.2rem);
        line-height: 1.7;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(3rem, 10vw, 7rem);
        line-height: 0.92;
        font-weight: 760;
        letter-spacing: 0;
      }

      a {
        color: #90d4b5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ResonantDAO</h1>
      <p>
        The Community of Communities layer for ResonantOS. Membership,
        credentials, and DAO access are moving on-chain.
      </p>
      <p>
        Public website foundation. The NFT registration flow will connect here
        once the membership program is deployed.
      </p>
    </main>
  </body>
</html>
